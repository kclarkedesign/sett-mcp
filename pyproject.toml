# The `sett-mcp` command: a thin wrapper around Copier for this repo's template.
# The template itself lives in template/ and is not part of this package.
[project]
name = "sett-mcp"
dynamic = ["version"]
description = "Create safe-by-default Python MCP servers: read-only until you say otherwise."
readme = "docs/pypi.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kirk Clarke" }]
keywords = ["mcp", "model-context-protocol", "copier-template", "guardrails", "ai-safety", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]
dependencies = ["copier>=9.4,<10"]

[project.scripts]
sett-mcp = "sett_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/kclarkedesign/sett-mcp"
Source = "https://github.com/kclarkedesign/sett-mcp"
Issues = "https://github.com/kclarkedesign/sett-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# The version comes from the git tag (v0.3.3 -> 0.3.3), so a release needs no version bump:
# create the GitHub release and the publish workflow builds that version.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"  # PyPI refuses "+local" versions
# Only this package's tags (v0.3.3), so another package released from this repo with its
# own tags (sett-fastmcp-v0.1.0) can't set sett-mcp's version.
tag_regex = '^v(?P<version>\d+(?:\.\d+)*(?:[-.]?(?:a|b|rc)\d+)?)$'
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[tool.hatch.build.targets.wheel]
packages = ["src/sett_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src/sett_mcp", "/tests", "/docs/pypi.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
