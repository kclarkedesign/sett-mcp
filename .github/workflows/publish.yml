# Publishes the `sett-mcp` command to PyPI.
# Runs when a GitHub release is published, or by hand from the Actions tab ("Run workflow", choosing a v* tag).
# PyPI trusts this workflow directly (trusted publishing), so no API token is stored anywhere.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Only from a release tag: the version is read from the tag, so a run from a branch
    # would build a ".dev" version, which shouldn't reach PyPI.
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv run --extra dev pytest
      - run: uv build
      - name: Check the built version matches the tag
        # Compared as normalized versions: a tag v1.2.3-rc1 builds a wheel named 1.2.3rc1.
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import os, pathlib
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version
          tag = Version(os.environ["GITHUB_REF_NAME"].removeprefix("v"))
          built = {parse_wheel_filename(p.name)[1] for p in pathlib.Path("dist").glob("*.whl")}
          print(f"tag {tag}, built {sorted(map(str, built))}")
          if built != {tag}:
              raise SystemExit(f"dist/ doesn't hold version {tag}")
          PY
      - run: uv publish
