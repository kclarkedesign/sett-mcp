name: Test template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
        license: [Apache-2.0, MIT]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Render
        run: |
          uvx copier copy --trust --defaults --vcs-ref HEAD \
            --data project_name="CI Check MCP" --data license=${{ matrix.license }} \
            . "$RUNNER_TEMP/ci-check-mcp"
      - name: Test rendered project
        working-directory: ${{ runner.temp }}/ci-check-mcp
        run: uv run --extra dev pytest

  docker:
    # Builds the generated project's Dockerfile and lists its tools over stdio,
    # the way MCP directories such as Glama start a server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Render
        run: uvx copier copy --trust --defaults --vcs-ref HEAD . "$RUNNER_TEMP/docker-check"
      - name: Build image
        run: docker build -t docker-check "$RUNNER_TEMP/docker-check"
      - name: List tools over stdio
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          { printf '%s\n' "$init" '{"jsonrpc":"2.0","method":"notifications/initialized"}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 5; } \
            | docker run --rm -i docker-check > out.jsonl
          cat out.jsonl
          grep -q '"acme_search_contacts"' out.jsonl
          ! grep -q '"acme_delete_contact"' out.jsonl  # writes are off by default

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv run --extra dev pytest
      - run: uv build
